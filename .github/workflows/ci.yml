name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which writes the client the app imports.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Must follow the build: Next generates the global PageProps/LayoutProps/
      # RouteContext types into .next/types, and tsc cannot resolve them before that.
      - run: npm run typecheck
